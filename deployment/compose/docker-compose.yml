services:
  safesight:
    build: 
      context: ../../
      dockerfile: deployment/docker/Dockerfile.prod
    image: safesight-ai:${IMAGE_TAG:-1.0.0}
    restart: unless-stopped
    user: "10001:10001"
    ports:
      - "127.0.0.1:8501:8501"
    env_file:
      - ../../.env
    environment:
      SAFE_SIGHT_ENV: production
      PPE_MODEL_PATH: models/best.pt
    volumes:
      - safesight-data:/app/data
      - ../../models:/app/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
        reservations:
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  reverse-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ../nginx/safesight.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/tls:/etc/nginx/tls:ro
    depends_on:
      safesight:
        condition: service_healthy

volumes:
  safesight-data:
    driver: local
