# SAFE SIGHT AI — TLS-terminating reverse proxy example.
# Copy to your proxy host, install certificates, and set
# Streamlit corsAllowedOrigins / allowedHosts to your domain.
upstream safesight {
  server safesight:8501 max_fails=3 fail_timeout=10s;
}

server {
  listen 80;
  server_name safety.example.com;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  server_name safety.example.com;

  ssl_certificate /etc/nginx/tls/fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  client_max_body_size 500m;

  location / {
    proxy_pass http://safesight;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  location /_stcore/health {
    proxy_pass http://safesight/_stcore/health;
    access_log off;
  }
}
