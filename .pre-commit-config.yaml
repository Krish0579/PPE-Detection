# Local enforcement of the same gates CI runs. Install once: `pre-commit install`.
# Version pins mirror requirements-dev.txt (ruff<1).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff
        args: [--exit-non-zero-on-fix]
      - id: ruff-format
