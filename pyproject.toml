[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-sight-ai"
version = "1.0.0"
description = "On-premise PPE-compliance computer vision monitoring"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Proprietary - deployment license required" }
dependencies = [
  "streamlit>=1.40,<2",
  "streamlit-webrtc>=0.62,<1",
  "ultralytics>=8.3,<9",
  # CVE remediation floor — see SECURITY.md § Dependency CVE policy.
  "torch>=2.14,<3",
  "torchvision>=0.29",
  "opencv-python>=4.10,<4.12",
  "numpy>=1.26,<2",
  "pandas>=2.2,<4",
  "av>=12,<18",
  "PySide6>=6.6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "pytest-qt>=4.4",
  "pypdf>=5.0",
  "pip-audit>=2.7",
  "ruff>=0.8,<1",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [".cache", "data", "runs", ".venv", ".agents", "awesome-freellm-apis"]

[tool.ruff.lint.per-file-ignores]
# Documented intentional patterns:
# - BLE001: blind `except Exception` at UI/hardware/storage boundaries is deliberate
#   error containment — failures are surfaced via st.error()/telemetry and must never
#   crash the operator session.
# - S110: `try/except/pass` is used only for best-effort resource cleanup (e.g.
#   releasing video captures) where a failure carries no actionable information.
# - DTZ005/DTZ006: naive datetimes are intentional — all timestamps shown to
#   operators and embedded in evidence filenames are local wall-clock time by design.
"app.py" = ["BLE001", "S110", "DTZ005", "DTZ006", "SIM102"]
"src/ui/**" = ["BLE001", "S110", "DTZ005", "DTZ006"]
"src/desktop/**" = ["BLE001", "S110", "DTZ005", "DTZ006", "RUF012", "TRY401"]
"src/core/model_manager.py" = ["BLE001", "S110"]
"src/core/ppe_associator.py" = ["BLE001", "S110"]
"src/storage/evidence.py" = ["BLE001", "DTZ006"]
"src/storage/pdf_report.py" = ["BLE001", "S110", "DTZ005", "DTZ006"]
"src/video/**" = ["BLE001", "S110", "DTZ005"]
"tests/**" = ["BLE001", "S110"]
"src/alerts/**" = ["BLE001"]
"src/storage/backup.py" = ["BLE001"]
"src/privacy/**" = ["BLE001", "S112"]
"scripts/**" = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
# Ratchet: measured baseline 65.06% branch-inclusive (2026-09-26). Raise as coverage grows; never lower.
fail_under = 65
exclude_also = [
  "if __name__ == ['\"]__main__['\"]:",
  "if TYPE_CHECKING:",
]
